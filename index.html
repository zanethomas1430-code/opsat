<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPSAT</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #000; color: #33ff33;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 18px; letter-spacing: 0.5px;
    padding: 10px; user-select: none;
  }
  .dim { color: #00aa44; }
  #hdr {
    display: flex; justify-content: space-between;
    border-bottom: 1px solid #00aa44; padding-bottom: 6px;
  }
  #gps { font-size: 13px; color: #00aa44; padding: 4px 0; }
  #tabs { display: flex; margin: 10px 0; }
  #tabs div {
    flex: 1; text-align: center; padding: 10px 0;
    border: 1px solid #00aa44; color: #00aa44;
  }
  #tabs div.on { background: #33ff33; color: #000; border-color: #33ff33; }
  .view { display: none; }
  .view.on { display: block; }
  .obj { padding: 12px 6px; border-bottom: 1px solid #003311; }
  .obj.done { color: #00aa44; text-decoration: line-through; }
  .obj .tag { font-size: 13px; }
  .obj .wp { font-size: 13px; color: #00aa44; }
  .intel { padding: 10px 6px; border-bottom: 1px solid #003311; }
  .intel .ts { font-size: 13px; color: #00aa44; }
  button {
    background: #000; color: #33ff33; border: 1px solid #33ff33;
    font: inherit; padding: 10px 14px; margin-top: 12px; width: 100%;
  }
  #mapdiv canvas { filter: brightness(2.2) sepia(1) hue-rotate(65deg) saturate(2.5); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: #000; color: #33ff33;
    border: 1px solid #33ff33; border-radius: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .leaflet-popup-content { margin: 10px 12px; font-size: 14px; }
  .wp-dist { color: #00aa44; font-size: 12px; }
</style>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/protomaps-leaflet.js"></script>
</head>
<body>

<div id="hdr">
  <span>OPSAT</span>
  <span id="clock" class="dim"></span>
</div>
<div id="gps">GPS: STANDBY</div>

<div id="tabs">
  <div data-v="obj" class="on">OBJ</div>
  <div data-v="intel">INTEL</div>
  <div data-v="map">MAP</div>
</div>

<div id="obj" class="view on"></div>

<div id="intel" class="view">
  <div id="intelList"></div>
  <button onclick="addIntel()">+ LOG INTEL</button>
</div>

<div id="map" class="view">
  <div id="mapdiv" style="height:70vh;background:#000"></div>
</div>

<script>
var state = JSON.parse(localStorage.getItem('opsat') || 'null') || {
  objectives: [
    { t: 'Establish OPSAT uplink', p: 'PRIMARY', done: true },
    { t: 'Verify hardware bridge', p: 'PRIMARY', done: false },
    { t: 'Mount unit on wrist', p: 'SECONDARY', done: false }
  ],
  intel: []
};

// migration: existing saved states have no waypoints yet.
// seed one sample so the feature is visible; delete or edit freely.
if (!state.objectives.some(function (o) { return o.ll; })) {
  state.objectives.push({
    t: 'Rally point: Pioneer Courthouse Sq',
    p: 'SECONDARY', done: false,
    ll: [45.5191, -122.6794]
  });
}

function save() { localStorage.setItem('opsat', JSON.stringify(state)); }
save();

function renderObj() {
  var el = document.getElementById('obj');
  el.innerHTML = '';
  state.objectives.forEach(function (o, i) {
    var d = document.createElement('div');
    d.className = 'obj' + (o.done ? ' done' : '');
    d.innerHTML = '<span class="tag dim">[' + o.p + ']</span> ' + o.t +
      (o.ll ? ' <span class="wp">&#9670;</span>' : '');
    d.onclick = function () { o.done = !o.done; save(); renderObj(); syncMarkers(); };
    el.appendChild(d);
  });
}

function renderIntel() {
  var el = document.getElementById('intelList');
  el.innerHTML = '';
  state.intel.slice().reverse().forEach(function (n) {
    var d = document.createElement('div');
    d.className = 'intel';
    d.innerHTML = '<div class="ts">' + n.ts + '</div>' + n.txt;
    el.appendChild(d);
  });
}

function addIntel() {
  var txt = prompt('INTEL:');
  if (!txt) return;
  state.intel.push({ txt: txt, ts: new Date().toLocaleString() });
  save(); renderIntel();
}

var gpsEl = null;
function setGps(msg) {
  if (!gpsEl) gpsEl = document.getElementById('gps');
  gpsEl.textContent = 'GPS: ' + msg;
}

// distance between two [lat,lng] in meters (haversine)
function distM(a, b) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a[0] * rad) * Math.cos(b[0] * rad) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s)));
}

function fmtDist(m) {
  return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m + ' m';
}

var map = null, myPos = null, wpMarkers = [];

function popupHtml(o) {
  var h = '<span class="tag dim">[' + o.p + ']</span> ' + o.t;
  if (myPos && o.ll) h += '<br><span class="wp-dist">DIST: ' + fmtDist(distM(myPos, o.ll)) + '</span>';
  return h;
}

function syncMarkers() {
  if (!map) return;
  wpMarkers.forEach(function (m) { map.removeLayer(m); });
  wpMarkers = [];
  state.objectives.forEach(function (o) {
    if (!o.ll) return;
    var mk = L.circleMarker(o.ll, {
      radius: 9,
      color: o.done ? '#00aa44' : '#33ff33',
      fillColor: '#000',
      fillOpacity: 0.7,
      weight: 2
    }).addTo(map);
    mk.bindPopup(popupHtml(o));
    mk._obj = o;
    wpMarkers.push(mk);
  });
}

function refreshPopups() {
  wpMarkers.forEach(function (mk) { mk.setPopupContent(popupHtml(mk._obj)); });
}

var mapStarted = false;
function initMap() {
  if (mapStarted) return;
  mapStarted = true;
  map = L.map('mapdiv').setView([45.5231, -122.6765], 14);
  protomapsL.leafletLayer({ url: 'portland.pmtiles', theme: 'dark' }).addTo(map);
  setTimeout(function () { map.invalidateSize(); }, 100);
  syncMarkers();
  if (!navigator.geolocation) { setGps('UNSUPPORTED'); return; }
  setGps('ACQUIRING\u2026');
  var me = null;
  navigator.geolocation.watchPosition(function (p) {
    myPos = [p.coords.latitude, p.coords.longitude];
    setGps('LOCKED \u00b1' + Math.round(p.coords.accuracy) + 'm');
    if (!me) {
      me = L.circleMarker(myPos, { radius: 7, color: '#33ff33', fillColor: '#33ff33', fillOpacity: 0.9 }).addTo(map);
      map.setView(myPos, 15);
    } else { me.setLatLng(myPos); }
    refreshPopups();
  }, function (e) {
    var names = { 1: 'DENIED', 2: 'UNAVAILABLE', 3: 'TIMEOUT' };
    setGps('ERR ' + e.code + ' ' + (names[e.code] || '') + ' \u2014 ' + e.message);
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 });
}

document.querySelectorAll('#tabs div').forEach(function (tab) {
  tab.onclick = function () {
    document.querySelectorAll('#tabs div').forEach(function (t) { t.classList.remove('on'); });
    document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('on'); });
    tab.classList.add('on');
    document.getElementById(tab.dataset.v).classList.add('on');
    if (tab.dataset.v === 'map') initMap();
  };
});

setInterval(function () {
  document.getElementById('clock').textContent =
    new Date().toTimeString().slice(0, 8);
}, 1000);

renderObj(); renderIntel();
</script>
</body>
</html>
